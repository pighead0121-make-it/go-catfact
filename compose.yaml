services:
  postgres:
    image: postgres:17-alpine
    container_name: catfact-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: catfact
      POSTGRES_DB: catfactdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catfactdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: catfact-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:catfact@postgres:5432/catfactdb?sslmode=disable
      - LISTEN_ADDR=:3000
    ports:
      - "3000:3000"

volumes:
  pgdata:

    